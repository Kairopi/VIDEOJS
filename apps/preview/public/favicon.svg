<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A film's fingerprint in five stripes: forest, dusk, night, dawn, credits. -->
  <defs><clipPath id="r"><rect width="32" height="32" rx="8"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="7" height="32" fill="#8a6a1f"/>
    <rect x="7" width="6" height="32" fill="#4e7a2a"/>
    <rect x="13" width="7" height="32" fill="#173e6b"/>
    <rect x="20" width="6" height="32" fill="#b35a78"/>
    <rect x="26" width="6" height="32" fill="#e3b866"/>
  </g>
</svg>
